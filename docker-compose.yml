services:
  mysql:
    image: mysql:8.0
    container_name: weather_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-weather_dashboard}
      MYSQL_USER: ${MYSQL_USER:-weather}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-weatherpass}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: weather_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: weather_backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-weather_dashboard}
      DB_USERNAME: ${MYSQL_USER:-weather}
      DB_PASSWORD: ${MYSQL_PASSWORD:-weatherpass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      OPEN_METEO_BASE_URL: https://api.open-meteo.com/v1
      OPEN_AQI_BASE_URL: https://air-quality-api.open-meteo.com/v1
      WEATHER_LAT: ${WEATHER_LAT:-51.5074}
      WEATHER_LON: ${WEATHER_LON:--0.1278}
      WEATHER_LOCATION_NAME: ${WEATHER_LOCATION_NAME:-London}
      WEATHER_FETCH_INTERVAL: ${WEATHER_FETCH_INTERVAL:-15}
      ALERT_TEMP_HIGH: ${ALERT_TEMP_HIGH:-35}
      ALERT_TEMP_LOW: ${ALERT_TEMP_LOW:-0}
      ALERT_WIND_HIGH: ${ALERT_WIND_HIGH:-50}
      ALERT_AQI_HIGH: ${ALERT_AQI_HIGH:-3}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@weather.local}
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      APPRISE_URL: ${APPRISE_URL:-http://apprise:8000}
      APPRISE_KEY: ${APPRISE_KEY:-weather}
      APPRISE_NOTIFICATION_URLS: ${APPRISE_NOTIFICATION_URLS:-}
    volumes:
      - ./backend:/var/www/html
      - backend_storage:/var/www/html/storage
      - /var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: weather_worker
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-weather_dashboard}
      DB_USERNAME: ${MYSQL_USER:-weather}
      DB_PASSWORD: ${MYSQL_PASSWORD:-weatherpass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      OPEN_METEO_BASE_URL: https://api.open-meteo.com/v1
      OPEN_AQI_BASE_URL: https://air-quality-api.open-meteo.com/v1
      WEATHER_LAT: ${WEATHER_LAT:-51.5074}
      WEATHER_LON: ${WEATHER_LON:--0.1278}
      WEATHER_LOCATION_NAME: ${WEATHER_LOCATION_NAME:-London}
      WEATHER_FETCH_INTERVAL: ${WEATHER_FETCH_INTERVAL:-15}
      ALERT_TEMP_HIGH: ${ALERT_TEMP_HIGH:-35}
      ALERT_TEMP_LOW: ${ALERT_TEMP_LOW:-0}
      ALERT_WIND_HIGH: ${ALERT_WIND_HIGH:-50}
      ALERT_AQI_HIGH: ${ALERT_AQI_HIGH:-3}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@weather.local}
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      APPRISE_URL: ${APPRISE_URL:-http://apprise:8000}
      APPRISE_KEY: ${APPRISE_KEY:-}
      APPRISE_NOTIFICATION_URLS: ${APPRISE_NOTIFICATION_URLS:-}
    volumes:
      - ./backend:/var/www/html
      - backend_storage:/var/www/html/storage
      - /var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: weather_scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-weather_dashboard}
      DB_USERNAME: ${MYSQL_USER:-weather}
      DB_PASSWORD: ${MYSQL_PASSWORD:-weatherpass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      OPEN_METEO_BASE_URL: https://api.open-meteo.com/v1
      OPEN_AQI_BASE_URL: https://air-quality-api.open-meteo.com/v1
      WEATHER_LAT: ${WEATHER_LAT:-51.5074}
      WEATHER_LON: ${WEATHER_LON:--0.1278}
      WEATHER_LOCATION_NAME: ${WEATHER_LOCATION_NAME:-London}
      WEATHER_FETCH_INTERVAL: ${WEATHER_FETCH_INTERVAL:-15}
      ALERT_TEMP_HIGH: ${ALERT_TEMP_HIGH:-35}
      ALERT_TEMP_LOW: ${ALERT_TEMP_LOW:-0}
      ALERT_WIND_HIGH: ${ALERT_WIND_HIGH:-50}
      ALERT_AQI_HIGH: ${ALERT_AQI_HIGH:-3}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@weather.local}
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      APPRISE_URL: ${APPRISE_URL:-http://apprise:8000}
      APPRISE_KEY: ${APPRISE_KEY:-}
      APPRISE_NOTIFICATION_URLS: ${APPRISE_NOTIFICATION_URLS:-}
    volumes:
      - ./backend:/var/www/html
      - backend_storage:/var/www/html/storage
      - /var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  apprise:
    image: caronc/apprise:latest
    container_name: weather_apprise
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - apprise_data:/config
    environment:
      APPRISE_STATELESS_URLS: ${APPRISE_NOTIFICATION_URLS:-}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        FASTIFY_API_URL: http://backend:8000/api
    container_name: weather_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
  backend_storage:
  apprise_data:
